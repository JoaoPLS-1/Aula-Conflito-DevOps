name: Verificar mascara da secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Exibir secret para verificar a mascara
        env:
          CHAVE_MESTRA: ${{ secrets.CHAVE_MESTRA }}
        run: |
          if [ -z "$CHAVE_MESTRA" ]; then
            echo "::error::A secret CHAVE_MESTRA nao esta configurada."
            exit 1
          fi

          echo "Valor de CHAVE_MESTRA: $CHAVE_MESTRA"
          echo "Verifique acima se o valor apareceu como ***."
